honeypot:
  # Candidates with 2+ flags are excluded entirely
  exclude_threshold: 2
  # Candidates with 1 flag get score capped
  single_flag_cap: 0.40

paths:
  cache_dir: ".cache/"
  data_dir: "data/"
  output_dir: "output/"
