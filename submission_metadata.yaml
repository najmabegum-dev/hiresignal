# HireSignal — Submission Metadata (corrected to match measured results)

team_name: "HireSignal"

primary_contact:
  name: "Najma Begum"
  contact: "https://github.com/najmabegum-dev"   # email and phone intentionally omitted from public repo

team_members:
  - name: "Najma Begum"
    role: "ML Engineer (solo)"

github_repo: "https://github.com/najmabegum-dev/hiresignal"
sandbox_link: null   # no hosted demo exists

reproduce_command: "python rank.py --candidates data/candidates.jsonl --out output/submission.csv"

compute:
  platform: "Google Colab (free tier)"
  cpu: "AMD EPYC 7B12, 2 vCPUs"
  ram_gb: 12
  python_version: "3.12"
  os: "Linux (Colab)"
  embedding_cache_built_on_gpu: true      # Tesla T4, full embedding run ~97 min
  ranking_stage_uses_gpu: false           # warm-cache timed run was CPU-only
  has_network_during_ranking: true        # HuggingFace Hub checks appear in logs unless HF_HUB_OFFLINE=1
  pre_computation_required: true
  pre_computation_time_minutes_gpu: 97    # T4 GPU, full 100K embedding
  pre_computation_time_minutes_cpu_cold: 143   # projected from 2.81 s/batch x 3125 batches
  runtime_seconds_warm_cache_cpu: 109     # embeddings loaded from .cache/*.npy
  runtime_seconds_warm_cache_gpu: 82
  cache_included_in_repo: false

ai_tools_used:
  - "Claude"
  - "Cursor / Antigravity"

ai_usage_summary: |
  Used Claude for architectural discussion, debugging guidance, and code
  review. Scoring logic, honeypot rules, and final decisions were made and
  verified by me. No candidate data was sent to any external LLM; the
  ranking pipeline makes no API calls.

methodology_summary: |
  Stage 1: BGE-Large embeddings + FAISS retrieval narrow 100K candidates to
  2,000. Stage 2: 4-signal scoring (skills, career, behavioral, education)
  with honeypot detection and capping. Stage 3: cross-encoder reranking of
  the top 300. Stage 4: template-based reasoning, no LLM calls.
  Note: a BGE-small pre-filter exists in src/fast_filter.py but is not wired
  into rank.py.

declarations:
  reproduction_tested: "warm-cache only; cold-start CPU run exceeded 5 minutes"
